<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>REAPER SVG Overlay</title><link rel="stylesheet" href="style.css">
<svg class="decoration" width="100%" height="100%" aria-hidden="true"><rect x="1%" y="1%" width="98%" height="98%" rx="24"/></svg>
<main>
<h1>REAPER / SVG OVERLAY</h1>
<div class="knobs">
<label>MASTER GAIN<svg viewBox="0 0 120 120"><circle class="interactive" id="gain" cx="60" cy="60" r="42" role="slider" tabindex="0" aria-label="Master gain"/><path id="gain-needle" d="M60 60V28"/></svg><output id="gain-value"></output></label>
<label>MASTER PAN<svg viewBox="0 0 120 120"><circle class="interactive" id="pan" cx="60" cy="60" r="42" role="slider" tabindex="0" aria-label="Master pan"/><path id="pan-needle" d="M60 60V28"/></svg><output id="pan-value"></output></label>
</div>
<p>Drag vertically · Shift for fine control<br>Outside the circles, mouse input reaches REAPER.</p>
<div class="toolbar"><button class="interactive" id="play">Play / stop</button><button class="interactive" id="fit">Fit display</button><button class="interactive" id="close">Close</button></div>
<p><select class="interactive" id="mode" aria-label="Mouse policy"><option value="regions">Interactive regions</option><option value="passthrough">Decoration only</option><option value="normal">Entire window</option></select></p>
<label class="interactive routing"><input id="shortcuts" type="checkbox" checked> Route shortcuts to REAPER Main</label>
<p><input class="interactive" id="note" placeholder="Text / IME stays here" aria-label="Text input demonstration"></p>
<p>Decoration-only recovery: run restore-interaction.lua or close-overlay.lua.</p>
<output id="status"></output>
</main><script type="module" src="app.js"></script></html>
