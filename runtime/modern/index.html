<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReaWebAPI modern starter</title></head>
<body><main><p class="eyebrow">ReaWebAPI · v0.1.6</p><h1>Build a REAPER tool</h1>
<p id="status" role="status">Connecting to REAPER…</p>
<section><h2>Project</h2><p id="project">Waiting for a connection</p>
