<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ReaWebAPI Starter</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <p class="eyebrow">REAWEBAPI SDK</p>
    <h1>Your next REAPER tool</h1>
    <p class="intro">A local page, connected to your project.</p>
    <section aria-labelledby="track-heading">
      <h2 id="track-heading">Selected track</h2>
      <p id="track-name">Waiting for REAPER…</p>
    </section>
    <div class="actions">
      <button id="refresh" disabled>Refresh</button>
    </div>
    <p id="status" role="status" aria-live="polite">Connecting…</p>
  </main>
</body>
</html>
