name: Build ReaWebAPI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: windows, arch: x64, runner: windows-2022 }
          - { platform: macos, arch: arm64, runner: macos-15 }
          - { platform: macos, arch: x86_64, runner: macos-15-intel }
          - { platform: linux, arch: x86_64, runner: ubuntu-24.04 }
          - { platform: linux, arch: aarch64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Check SDK types and build modern example
        run: |
          npm ci --prefix runtime/modern
          npm run build --prefix runtime/modern
          node runtime/modern/node_modules/typescript/bin/tsc --noEmit --strict --target ES2022 --lib ES2022,DOM tests/sdk_contract.ts
      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libx11-dev
      - name: Verify API definitions and native coverage
        run: python -m tools.api_sync verify
      - name: Configure Windows
        if: matrix.platform == 'windows'
        run: cmake -S . -B build -A x64 -DBUILD_TESTING=ON
      - name: Configure macOS
        if: matrix.platform == 'macos'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 -DBUILD_TESTING=ON
      - name: Configure Linux
        if: matrix.platform == 'linux'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release --parallel 3
      - name: Compile macOS DevTools integration test
        if: matrix.platform == 'macos'
        run: cmake --build build --config Release --target macos_devtools
      - name: Compile Docker integration test
        if: matrix.platform != 'windows'
        run: cmake --build build --config Release --target swell_dock_windows
      - name: Run regression tests
        run: ctest --test-dir build -C Release --output-on-failure
        env:
          PYTHONUTF8: '1'
      - name: Stage installation
        run: cmake --install build --config Release --prefix stage
      - name: Ad-hoc sign macOS extension
        if: matrix.platform == 'macos'
        run: codesign --force --sign - stage/UserPlugins/reaper_reawebapi-${{ matrix.arch }}.dylib
      - name: Package and checksums
        run: python tools/package.py --stage stage --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --revision ${{ github.sha }} --release-dir release
      - name: Upload installation bundle
        uses: actions/upload-artifact@v6
        with:
          name: ReaWebAPI-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: publish-reawebapi
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          pattern: ReaWebAPI-*
          path: release
          merge-multiple: true
      - name: Assemble ReaPack and publish native files
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_REVISION: ${{ github.sha }}
        run: python tools/release.py --assets release --revision "$BUILD_REVISION" --publish
